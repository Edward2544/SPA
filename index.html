<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly - Dictionary App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Wordly Dictionary</h1>
    </header>
    <main>
        <form id="search-form" aria-label="Search for a word">
            <input type="text" id="search-input" placeholder="Enter a word" aria-label="Word search input" required>
            <button type="submit">Search</button>
        </form>
        <section id="results">
            <!-- Dynamic content will be inserted here -->
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
